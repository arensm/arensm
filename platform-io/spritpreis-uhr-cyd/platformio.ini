[platformio]
default_envs = cyd-ili9341

[env]
platform = espressif32@55.3.37
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
extra_scripts = pre:tools/load_env.py
lib_deps =
  lovyan03/LovyanGFX @ 1.2.28
  bblanchon/ArduinoJson @ 7.4.3
  ricmoo/QRCode @ 0.0.1
  olikraus/U8g2 @ 2.36.18
build_flags =
  -DCORE_DEBUG_LEVEL=1

[env:cyd-st7789]
build_flags =
  ${env.build_flags}
  -DCYD_ST7789=1

; Falls das Bild trotz korrekter Verkabelung nur weiß bleibt, diese Umgebung
; auswählen. Einige ESP32-2432S028R-Chargen besitzen einen ILI9341.
[env:cyd-ili9341]
build_flags =
  ${env.build_flags}
  -DCYD_ILI9341=1
