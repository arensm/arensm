[platformio]
default_envs = bttf3

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:tools/load_env.py

[uhrensoehne-esp8266]
platform = espressif8266@4.2.1
board = d1_mini
board_build.filesystem = littlefs
build_src_filter =
  +<*.cpp>
  -<cl_spritpreis_cyd.cpp>
lib_deps =
  tzapu/WiFiManager @ 2.0.17
  bblanchon/ArduinoJson @ 6.21.5
  fastled/FastLED @ 3.4.0
  adafruit/Adafruit NeoPixel @ 1.12.0
  https://github.com/avishorp/TM1637.git
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
  -DFASTLED_ALLOW_INTERRUPTS=0
  -DFASTLED_INTERRUPT_RETRY_COUNT=0

[env:obegransad]
extends = uhrensoehne-esp8266
build_flags =
  ${uhrensoehne-esp8266.build_flags}
  -DACTIVE_CLOCK=1

[env:wordclock]
extends = uhrensoehne-esp8266
build_flags =
  ${uhrensoehne-esp8266.build_flags}
  -DACTIVE_CLOCK=2

[env:time-2-words]
extends = uhrensoehne-esp8266
build_flags =
  ${uhrensoehne-esp8266.build_flags}
  -DACTIVE_CLOCK=3

[env:sieben-segmente]
extends = uhrensoehne-esp8266
build_flags =
  ${uhrensoehne-esp8266.build_flags}
  -DACTIVE_CLOCK=4

[env:bttf1]
extends = uhrensoehne-esp8266
build_flags =
  ${uhrensoehne-esp8266.build_flags}
  -DACTIVE_CLOCK=10

[env:custom]
extends = uhrensoehne-esp8266
build_flags =
  ${uhrensoehne-esp8266.build_flags}
  -DACTIVE_CLOCK=99

[env:bttf3]
platform = espressif32@6.4.0
board = esp32dev
board_build.filesystem = littlefs
build_src_filter =
  +<*.cpp>
  -<cl_spritpreis_cyd.cpp>
lib_deps =
  tzapu/WiFiManager @ 2.0.17
  bblanchon/ArduinoJson @ 6.21.5
  adafruit/Adafruit NeoPixel @ 1.12.0
  https://github.com/avishorp/TM1637.git
build_flags =
  -DACTIVE_CLOCK=11

[spritpreis-cyd]
platform = espressif32@55.3.37
board = esp32dev
board_build.partitions = min_spiffs.csv
build_src_filter =
  -<*>
  +<main.cpp>
  +<cl_spritpreis_cyd.cpp>
lib_deps =
  lovyan03/LovyanGFX @ 1.2.28
  bblanchon/ArduinoJson @ 7.4.3
  ricmoo/QRCode @ 0.0.1
  olikraus/U8g2 @ 2.36.18
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DACTIVE_CLOCK=12

[env:spritpreis-cyd-st7789]
extends = spritpreis-cyd
build_flags =
  ${spritpreis-cyd.build_flags}
  -DCYD_ST7789=1

[env:spritpreis-cyd-ili9341]
extends = spritpreis-cyd
build_flags =
  ${spritpreis-cyd.build_flags}
  -DCYD_ILI9341=1
